<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px rgba(21, 21, 125, 0.05);
        }
        
        /* Custom Input Styles */
        .custom-input {
            background-color: #EDF0F7;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .custom-input:focus {
            background-color: #ffffff;
            border-color: #00f1fe;
            box-shadow: 0 0 0 4px rgba(0, 241, 254, 0.1);
            outline: none;
        }
        
        /* Custom Radio Button */
        .custom-radio {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #c7c5d4;
            border-radius: 50%;
            outline: none;
            transition: all 0.2s ease;
            position: relative;
            cursor: pointer;
        }
        .custom-radio:checked {
            border-color: #00f1fe;
            background-color: transparent;
        }
        .custom-radio:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #2e3192;
        }
        
        /* Gradient Background */
        .bg-mesh {
            background-color: #F4F7FF;
            background-image: 
                radial-gradient(at 0% 0%, hsla(237, 72%, 46%, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 0%, hsla(186, 100%, 50%, 0.05) 0px, transparent 50%);

<p class="font-body-md text-body-md text-on-surface-variant">Izin keperluan atau surat sakit.</p>
</div>
<!-- Form Card -->
<div class="glass-panel rounded-[24px] p-md space-y-lg">
<!-- Date Picker -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Pilih Tanggal</label>
<div class="relative">
<input class="w-full h-14 px-4 rounded-xl custom-input font-body-md text-body-md text-on-surface placeholder-outline-variant" placeholder="Ketuk untuk pilih tanggal..." type="date"/>
</div>
</div>
<!-- Category -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface mb-sm">Kategori</label>
<div class="flex gap-md">
<label class="flex items-center gap-xs cursor-pointer group">
<input checked="" class="custom-radio" name="kategori" type="radio" value="sakit"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Sakit</span>
</label>
<label class="flex items-center gap-xs cursor-pointer group">
<input class="custom-radio" name="kategori" type="radio" value="izin"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Izin Keperluan</span>
</label>
</div>
</div>
<!-- Reason / Description -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Alasan / Keterangan</label>
<textarea class="w-full p-4 rounded-xl custom-input font-body-md text-body-md text-on-surface placeholder-outline-variant resize-none" placeholder="Tulis detail alasan di sini..." rows="4"></textarea>
</div>
<hr class="border-t border-surface-variant/50"/>
<!-- File Upload -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Lampiran Bukti (Kamera Tanam)</label>
<button class="w-full h-40 rounded-xl border-2 border-dashed border-primary-fixed-dim bg-surface-container-low hover:bg-white hover:border-secondary-container transition-all flex flex-col items-center justify-center gap-sm group" type="button">
<div class="w-12 h-12 rounded-full bg-primary-container/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">photo_camera</span>
</div>
<div class="text-center">
<p class="font-label-md text-label-md text-primary">Ketuk untuk Buka Kamera</p>

</button>
